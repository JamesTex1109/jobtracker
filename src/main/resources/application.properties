spring.application.name=jobtracker

# Local dev: in-memory H2 in PostgreSQL mode (no install needed).
# Run with --spring.profiles.active=postgres to use a real database.
spring.datasource.url=jdbc:h2:mem:jobtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
