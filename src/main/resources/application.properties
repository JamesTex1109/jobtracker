spring.application.name=jobtracker

# Local dev: in-memory H2 in PostgreSQL mode (no install needed).
# Run with --spring.profiles.active=postgres to use a real database.
spring.datasource.url=jdbc:h2:mem:jobtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Hosting: honor the platform's port and its HTTPS proxy headers.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# true when served over HTTPS (set in render.yaml); false for plain-http localhost.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
