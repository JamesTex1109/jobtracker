# Local full stack: `docker compose up --build`, then open http://localhost:8080
# Credentials here are for local development only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,demo
      DATABASE_URL: jdbc:postgresql://db:5432/jobtracker
      DATABASE_USERNAME: jobtracker
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
    ports:
      - "8080:8080"

volumes:
  pgdata:
