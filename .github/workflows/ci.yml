name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      # Includes the Testcontainers suite against real PostgreSQL (Docker is available on the runner).
      - name: Build and test
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Start full stack with Docker Compose
        run: docker compose up --build --detach
      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Smoke test sign-in against PostgreSQL
        run: |
          set -euo pipefail
          curl -sf -c jar -b jar http://localhost:8080/api/auth/csrf
          TOKEN=$(grep XSRF-TOKEN jar | awk '{print $7}')
          curl -sf -o /dev/null -c jar -b jar -H "X-XSRF-TOKEN: $TOKEN" \
            -d email=demo@jobtracker.dev -d password=demo1234 http://localhost:8080/api/auth/login
          curl -sf -b jar http://localhost:8080/api/applications/stats | tee stats.json
          grep -q '"total":8' stats.json
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes
